<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Me To You Designs | Live Giveaway Draw</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #ffffff 0%,
      transparent 40%
    ),
    linear-gradient(
      135deg,
      #fff7fa,
      #f8dfe9
    );

  color: #333;

  padding: 25px 15px 60px;

  overflow-x: hidden;
}


.page {

  width: 100%;

  max-width: 760px;

  margin: 0 auto;

  text-align: center;

}


.logo {

  margin-bottom: 8px;

}


.logo img {

  width: 220px;

  max-width: 75%;

  height: auto;

  display: block;

  margin: 0 auto;

}


.subtitle {

  color: #777;

  font-size: 13px;

  letter-spacing: 2px;

  margin-bottom: 20px;

}


/* LIVE CLOCK */

.live-time {

  display: inline-block;

  background: rgba(255,255,255,0.96);

  border: 1px solid #efd5df;

  border-radius: 18px;

  padding: 12px 22px;

  margin-bottom: 22px;

  box-shadow:
    0 8px 25px
    rgba(120,70,90,0.10);

}


.live-date {

  color: #777;

  font-size: 13px;

  margin-bottom: 4px;

}


.live-clock {

  color: #b76e8a;

  font-size: 23px;

  font-weight: 800;

}


/* MAIN CARD */

.card {

  background: rgba(255,255,255,0.97);

  border-radius: 30px;

  padding: 35px 22px;

  box-shadow:
    0 20px 60px
    rgba(100,50,70,0.16);

}


.eyebrow {

  color: #999;

  font-size: 13px;

  letter-spacing: 4px;

  margin-bottom: 10px;

}


h1 {

  color: #b76e8a;

  font-size: 40px;

  margin-bottom: 10px;

}


.intro {

  color: #777;

  font-size: 14px;

  line-height: 1.6;

  margin-bottom: 25px;

}


/* PRIZE */

.prize {

  background:
    linear-gradient(
      135deg,
      #fff5f8,
      #fce7ef
    );

  border: 1px solid #f0d4df;

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 25px;

}


.prize-icon {

  font-size: 38px;

  margin-bottom: 7px;

}


.prize-title {

  color: #b76e8a;

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 5px;

}


.prize-text {

  color: #777;

  font-size: 14px;

  line-height: 1.6;

}


/* ENTRIES */

.entry-section {

  text-align: left;

  background: #fff8fa;

  border: 1px solid #f0dce4;

  border-radius: 20px;

  padding: 20px;

}


.entry-heading {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  margin-bottom: 12px;

}


.entry-heading strong {

  color: #b76e8a;

  font-size: 16px;

}


.entry-count {

  background: #b76e8a;

  color: white;

  border-radius: 20px;

  padding: 5px 11px;

  font-size: 12px;

  font-weight: bold;

}


textarea {

  width: 100%;

  min-height: 180px;

  resize: vertical;

  border: 1px solid #e5cbd5;

  border-radius: 14px;

  padding: 14px;

  background: white;

  color: #444;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 15px;

  line-height: 1.7;

  outline: none;

}


textarea:focus {

  border-color: #b76e8a;

}


.helper {

  color: #999;

  font-size: 12px;

  margin-top: 9px;

  line-height: 1.5;

}


/* VISIBLE NAMES */

.entry-list {

  margin-top: 18px;

  max-height: 280px;

  overflow-y: auto;

  border-radius: 14px;

}


.entry {

  display: flex;

  align-items: center;

  gap: 10px;

  background: white;

  padding: 9px 10px;

  border-bottom:
    1px solid #f1e3e8;

  font-size: 14px;

}


.entry:last-child {

  border-bottom: none;

}


.entry-number {

  min-width: 28px;

  height: 28px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 50%;

  background: #f5dce5;

  color: #b76e8a;

  font-size: 11px;

  font-weight: bold;

}


/* DRAW AREA */

.draw-area {

  margin-top: 25px;

  padding: 28px 15px;

  border-radius: 24px;

  background:
    linear-gradient(
      135deg,
      #fff5f8,
      #fce7ef
    );

  border: 1px solid #efd3de;

}


.draw-label {

  color: #999;

  font-size: 12px;

  letter-spacing: 3px;

  margin-bottom: 10px;

}


.spinning-name {

  min-height: 75px;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #b76e8a;

  font-size: 30px;

  font-weight: 900;

  padding: 5px;

  word-break: break-word;

  transition: transform 0.1s ease;

}


.spinning-name.active {

  animation:
    nameBounce
    0.12s
    infinite alternate;

}


@keyframes nameBounce {

  from {
    transform: scale(0.97);
  }

  to {
    transform: scale(1.03);
  }

}


/* COUNTDOWN */

.countdown {

  font-size: 65px;

  font-weight: 900;

  color: #b76e8a;

  animation:
    countdownPop
    0.8s
    ease;

}


@keyframes countdownPop {

  0% {

    transform: scale(0.4);

    opacity: 0;

  }

  70% {

    transform: scale(1.15);

    opacity: 1;

  }

  100% {

    transform: scale(1);

  }

}


/* DRAW BUTTON */

.draw-button {

  margin-top: 20px;

  border: none;

  background:
    linear-gradient(
      135deg,
      #c9829d,
      #ad5f7d
    );

  color: white;

  font-size: 18px;

  font-weight: 800;

  padding: 17px 35px;

  border-radius: 50px;

  cursor: pointer;

  box-shadow:
    0 10px 25px
    rgba(173,95,125,0.35);

  transition:
    0.25s ease;

}


.draw-button:hover {

  transform:
    translateY(-3px)
    scale(1.02);

}


.draw-button:disabled {

  opacity: 0.6;

  cursor: not-allowed;

  transform: none;

}


/* WINNER */

.winner {

  display: none;

  margin-top: 28px;

}


.winner-card {

  background:
    linear-gradient(
      135deg,
      #fff7fa,
      #fce5ed
    );

  border: 2px solid #e9c0cf;

  border-radius: 27px;

  padding: 32px 15px;

  animation:
    winnerReveal
    1s
    cubic-bezier(
      .17,
      .67,
      .35,
      1.4
    );

}


@keyframes winnerReveal {

  0% {

    opacity: 0;

    transform:
      scale(0.2)
      rotate(-6deg);

  }

  60% {

    transform:
      scale(1.08)
      rotate(2deg);

  }

  100% {

    opacity: 1;

    transform:
      scale(1)
      rotate(0);

  }

}


.winner-label {

  color: #999;

  font-size: 14px;

  letter-spacing: 3px;

  margin-bottom: 12px;

}


.winner-name {

  color: #b76e8a;

  font-size: 46px;

  font-weight: 900;

  line-height: 1.1;

  word-break: break-word;

  margin-bottom: 13px;

}


.congratulations {

  color: #555;

  font-size: 21px;

  font-weight: 800;

  margin-bottom: 10px;

}


.winner-prize {

  color: #777;

  font-size: 14px;

  line-height: 1.6;

}


.drawn-time {

  margin-top: 18px;

  color: #999;

  font-size: 12px;

  line-height: 1.6;

}


/* THANK YOU */

.thank-you {

  margin-top: 30px;

  padding-top: 25px;

  border-top: 1px solid #eee;

  color: #777;

  font-size: 14px;

  line-height: 1.7;

}


.business {

  margin-top: 20px;

  color: #
